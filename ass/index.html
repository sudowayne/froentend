<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4 sm:p-8"
  >
    <!-- header -->
    <header class="text-center mb-6">
      <p
        class="text-[11px] font-bold text-indigo-400 uppercase tracking-widest"
      >
        Fatimah Spotlight
      </p>
      <p class="text-xl sm:text-2xl font-extrabold text-white mt-1">
        She's a curated frontend dev!
      </p>
    </header>

    <!-- main container -->
    <main class="w-full flex justify-center">
      <article
        class="relative w-full max-w-sm sm:max-w-md bg-slate-900 border border-red-800 
        rounded-3xl p-5 shadow-2xl transition-all duration-300 hover:border-slate-600"
      >
        <span
          class="absolute -top-3 left-8 bg-gradient-to-r from-amber-500 to-orange-500 
          text-slate-950 font-extrabold text-[11px] px-3 py-0.5 rounded-full shadow-lg uppercase tracking-wider"
          >i am giving 50% off today</span
        >
      </article>
    </main>
  </body>
</html>
